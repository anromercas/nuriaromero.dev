name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The guard script and its libs come from the trusted BASE commit
      # (extracted to a temp dir), so a PR cannot change them; the PR head is
      # only data (HEAD_SHA). A PR can still edit this workflow, which only
      # owner-only branch protection/rulesets or CODEOWNERS on .github/workflows/
      # closes. Bootstrap: fall back to the head copy ONLY while the base
      # workflow does not yet contain this guard (the PR that introduces it);
      # afterwards a missing base script fails closed. Needs no dependencies.
      - name: Publish approval guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:scripts/check-publish-approval.mjs" 2>/dev/null; then
            guard="$RUNNER_TEMP/publish-guard"
            mkdir -p "$guard"
            git archive "$BASE_SHA" scripts | tar -x -C "$guard"
            node "$guard/scripts/check-publish-approval.mjs"
          elif git show "$BASE_SHA:.github/workflows/ci.yml" | grep -q check-publish-approval; then
            echo "Base workflow has the guard but scripts/check-publish-approval.mjs is missing at $BASE_SHA: failing closed."
            exit 1
          else
            echo "Bootstrap: base workflow has no guard yet ($BASE_SHA); running the head copy."
            node scripts/check-publish-approval.mjs
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test tests/*.test.js
      - name: SEO build checks
        run: pnpm check:seo:dist
