name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Runs the guard from the trusted BASE commit (extracted to a temp dir),
      # so a PR cannot rewrite the guard that judges it. The PR head is only
      # data (HEAD_SHA). Bootstrap: while the base has no guard script yet (the
      # PR that introduces it), fall back to the head copy and say so; once
      # merged, every later PR runs the base copy. Needs no dependencies.
      - name: Publish approval guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:scripts/check-publish-approval.mjs" 2>/dev/null; then
            guard="$RUNNER_TEMP/publish-guard"
            mkdir -p "$guard"
            git archive "$BASE_SHA" scripts | tar -x -C "$guard"
            node "$guard/scripts/check-publish-approval.mjs"
          else
            echo "Bootstrap: guard script absent at base $BASE_SHA; running the head copy."
            node scripts/check-publish-approval.mjs
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test tests/*.test.js
      - name: SEO build checks
        run: pnpm check:seo:dist
